<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horvitz--Thompson and Hájek MSE laboratory</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --foreground: #202124;
      --muted: #5f6368;
      --line: #d9dde3;
      --panel: #f6f8fa;
      --ht: #3b6fb6;
      --hajek: #d36b35;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #1f2227;
        --foreground: #f1f3f4;
        --muted: #bdc1c6;
        --line: #4b5158;
        --panel: #292d33;
        --ht: #78a8e8;
        --hajek: #ef9a69;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      background: var(--background);
      color: var(--foreground);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.35;
    }
    main { max-width: 900px; margin: 0 auto; }
    h2 { margin: 0 0 0.35rem; font-size: 1.25rem; }
    .intro { margin: 0 0 1rem; color: var(--muted); }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.7rem 1rem;
      padding: 0.9rem;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      background: var(--panel);
    }
    .control { display: grid; gap: 0.2rem; font-size: 0.9rem; }
    .control-line { display: flex; justify-content: space-between; gap: 1rem; }
    input[type="range"] { width: 100%; }
    input[type="number"] {
      width: 7rem;
      padding: 0.25rem 0.35rem;
      border: 1px solid var(--line);
      border-radius: 0.25rem;
      background: var(--background);
      color: var(--foreground);
    }
    .toggle { display: flex; align-items: center; gap: 0.5rem; min-height: 2.6rem; }
    .chart {
      margin-top: 1rem;
      padding: 0.8rem 0.8rem 0.5rem;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
    }
    .plot {
      height: 270px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: end;
      padding: 1.8rem 8% 0;
      border-bottom: 1px solid var(--foreground);
      background-image: linear-gradient(to top, var(--line) 1px, transparent 1px);
      background-size: 100% 25%;
    }
    .bar-group { height: 100%; display: grid; grid-template-rows: 1fr auto; gap: 0.4rem; }
    .bar-slot { min-height: 0; display: flex; align-items: end; justify-content: center; }
    .bar {
      position: relative;
      width: min(150px, 72%);
      min-height: 4px;
      border-radius: 0.2rem 0.2rem 0 0;
    }
    .bar.ht { background: var(--ht); }
    .bar.hajek { background: var(--hajek); }
    .mse-value {
      position: absolute;
      left: 50%;
      top: -1.55rem;
      transform: translateX(-50%);
      white-space: nowrap;
      font-weight: 650;
      color: var(--foreground);
    }
    .bar-label { text-align: center; font-weight: 650; }
    .bias { text-align: center; min-height: 1.25rem; color: var(--muted); font-size: 0.82rem; }
    .summary { margin: 0.75rem 0 0; }
    .winner { font-weight: 700; }
    .technical { color: var(--muted); font-size: 0.86rem; }
    @media (max-width: 560px) {
      body { padding: 0.6rem; }
      .plot { gap: 0.7rem; padding-inline: 3%; }
      .bar { width: 78%; }
    }
  </style>
</head>
<body>
  <main>
    <h2>HT versus Hájek under Bernoulli assignment</h2>
    <p class="intro">The finite population is held fixed while treatment is reassigned 5,000 times. MSE is conditional on both arms being nonempty.</p>

    <form class="controls" aria-label="Simulation controls">
      <label class="control" for="n">
        <span class="control-line"><span>Population size, <em>N</em></span><output id="n-value">80</output></span>
        <input id="n" type="range" min="20" max="200" step="10" value="80">
      </label>
      <label class="control" for="p">
        <span class="control-line"><span>Treatment probability, <em>p</em></span><output id="p-value">0.30</output></span>
        <input id="p" type="range" min="0.2" max="0.8" step="0.05" value="0.3">
      </label>
      <label class="control" for="baseline">
        <span class="control-line"><span>Outcome baseline, <em>b</em></span><output id="baseline-value">4.00</output></span>
        <input id="baseline" type="range" min="0" max="8" step="0.25" value="4">
      </label>
      <label class="control" for="spread">
        <span class="control-line"><span>Outcome spread, <em>σ</em></span><output id="spread-value">1.00</output></span>
        <input id="spread" type="range" min="0.25" max="3" step="0.25" value="1">
      </label>
      <label class="control" for="effect">
        <span class="control-line"><span>Treatment effect, <em>τ</em></span><output id="effect-value">0.50</output></span>
        <input id="effect" type="range" min="0" max="2" step="0.1" value="0.5">
      </label>
      <label class="control" for="seed">
        <span>Deterministic seed</span>
        <input id="seed" type="number" min="1" max="999999" step="1" value="6165">
      </label>
      <label class="toggle" for="show-bias">
        <input id="show-bias" type="checkbox" checked>
        <span>Report squared bias below each bar</span>
      </label>
    </form>

    <section class="chart" aria-label="Conditional mean squared error comparison">
      <div class="plot" aria-hidden="true">
        <div class="bar-group">
          <div class="bar-slot"><div id="ht-bar" class="bar ht"><span id="ht-mse" class="mse-value"></span></div></div>
          <div><div class="bar-label">Horvitz--Thompson</div><div id="ht-bias" class="bias"></div></div>
        </div>
        <div class="bar-group">
          <div class="bar-slot"><div id="hajek-bar" class="bar hajek"><span id="hajek-mse" class="mse-value"></span></div></div>
          <div><div class="bar-label">Hájek</div><div id="hajek-bias" class="bias"></div></div>
        </div>
      </div>
      <p id="summary" class="summary" aria-live="polite"></p>
      <p id="technical" class="technical"></p>
    </section>
  </main>

  <script>
    "use strict";

    const ids = ["n", "p", "baseline", "spread", "effect", "seed", "show-bias"];
    const controls = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function standardNormal(rng) {
      let u = 0;
      let v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    function summarize(values, truth) {
      const mean = values.reduce((a, b) => a + b, 0) / values.length;
      const bias = mean - truth;
      const mse = values.reduce((a, b) => a + (b - truth) ** 2, 0) / values.length;
      return {mse, bias2: bias ** 2};
    }

    function simulate() {
      const n = Number(controls.n.value);
      const p = Number(controls.p.value);
      const baseline = Number(controls.baseline.value);
      const spread = Number(controls.spread.value);
      const effect = Number(controls.effect.value);
      const seed = Math.max(1, Math.round(Number(controls.seed.value) || 6165));
      const repetitions = 5000;
      const rng = mulberry32(seed);
      const x = Array.from({length: n}, () => standardNormal(rng));
      const xbar = x.reduce((a, b) => a + b, 0) / n;
      const y0 = x.map(v => baseline + spread * (v - xbar));
      const y1 = y0.map(v => v + effect);
      const ht = [];
      const hajek = [];
      let skipped = 0;

      for (let r = 0; r < repetitions; ++r) {
        let n1 = 0;
        let treatedTotal = 0;
        let controlTotal = 0;
        for (let i = 0; i < n; ++i) {
          if (rng() < p) {
            n1 += 1;
            treatedTotal += y1[i];
          } else {
            controlTotal += y0[i];
          }
        }
        if (n1 === 0 || n1 === n) {
          skipped += 1;
          continue;
        }
        ht.push(treatedTotal / (n * p) - controlTotal / (n * (1 - p)));
        hajek.push(treatedTotal / n1 - controlTotal / (n - n1));
      }

      return {
        ht: summarize(ht, effect),
        hajek: summarize(hajek, effect),
        skipped: skipped / repetitions,
        retained: ht.length,
      };
    }

    function display() {
      document.getElementById("n-value").textContent = controls.n.value;
      document.getElementById("p-value").textContent = Number(controls.p.value).toFixed(2);
      document.getElementById("baseline-value").textContent = Number(controls.baseline.value).toFixed(2);
      document.getElementById("spread-value").textContent = Number(controls.spread.value).toFixed(2);
      document.getElementById("effect-value").textContent = Number(controls.effect.value).toFixed(2);

      const result = simulate();
      const maxMse = Math.max(result.ht.mse, result.hajek.mse);
      const htHeight = Math.max(2, 88 * result.ht.mse / maxMse);
      const hajekHeight = Math.max(2, 88 * result.hajek.mse / maxMse);
      document.getElementById("ht-bar").style.height = `${htHeight}%`;
      document.getElementById("hajek-bar").style.height = `${hajekHeight}%`;
      document.getElementById("ht-mse").textContent = result.ht.mse.toFixed(4);
      document.getElementById("hajek-mse").textContent = result.hajek.mse.toFixed(4);

      const showBias = controls["show-bias"].checked;
      document.getElementById("ht-bias").textContent = showBias ? `bias² = ${result.ht.bias2.toExponential(2)}` : "";
      document.getElementById("hajek-bias").textContent = showBias ? `bias² = ${result.hajek.bias2.toExponential(2)}` : "";

      const winner = result.ht.mse < result.hajek.mse ? "Horvitz--Thompson" : "Hájek";
      document.getElementById("summary").innerHTML = `<span class="winner">${winner} has lower conditional MSE.</span> HT: ${result.ht.mse.toFixed(4)}; Hájek: ${result.hajek.mse.toFixed(4)}.`;
      document.getElementById("technical").textContent = `${result.retained.toLocaleString()} nondegenerate assignments retained; ${(100 * result.skipped).toFixed(2)}% empty-arm assignments skipped.`;
    }

    ids.forEach(id => controls[id].addEventListener("change", display));
    display();
  </script>
</body>
</html>
